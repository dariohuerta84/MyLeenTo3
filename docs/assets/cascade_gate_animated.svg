  <circle r="3" fill="#B45309"><animateMotion path="M862,138 L926,138" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle r="3" fill="#BE123C"><animateMotion path="M862,174 L926,190" dur="1.7s" repeatCount="indefinite"/></circle>

